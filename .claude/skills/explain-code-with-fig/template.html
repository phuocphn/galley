<!DOCTYPE html>
<!--
  explain-code-with-fig — page scaffold.
  Fill the marked regions. Do NOT re-derive the CSS or the toggle script.
  The file must stay fully self-contained: no external fonts/scripts/images/CDNs.

  How to use:
    1. Set <title> and the <h1> in <header>.
    2. Add one <a> per Part inside #toc.
    3. Replace the SAMPLE Part with your real Parts (copy the <section class="part"> block).
    4. Drop figures from svg-cookbook.md into <figure class="fig"> blocks; give each a <figcaption>.
    5. Code goes in <pre class="code">…</pre>; wrap tokens in <span class="tok-kw|str|num|com|fn">.
    6. Boxed punchline equations use <div class="boxed-eq">…</div>.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- FILL: e.g. Quicksort, explained --></title>
<style>
  /* ---------- Theme variables (both themes) ---------- */
  :root {
    --bg:        #fbfaf7;
    --surface:   #ffffff;
    --text:      #1c1b19;
    --muted:     #6b6862;
    --border:    #e3ded4;
    --accent:    #b4531f;   /* warm textbook accent */
    --accent-sf: #fbeee4;   /* accent surface */
    --link:      #9a4419;
    /* figure palette — SVG uses ONLY these, never raw hex */
    --fig-bg:     #ffffff;
    --fig-stroke: #3a3833;
    --fig-muted:  #b9b4a8;
    --fig-accent: #b4531f;
    --fig-accent2:#2f6f6a;
    --fig-fill:   #fbeee4;
    --fig-fill2:  #e6f0ef;
    --fig-text:   #1c1b19;
    --code-bg:    #f4f1ea;
    --tok-kw:  #a63a1c; --tok-str: #3f7d3a; --tok-num: #8a5a00;
    --tok-com: #9a968c; --tok-fn:  #2f6f6a;
  }
  :root[data-theme="dark"] {
    --bg:        #171614;
    --surface:   #201e1b;
    --text:      #ece8e0;
    --muted:     #a19c90;
    --border:    #34312b;
    --accent:    #e08a4e;
    --accent-sf: #2a211a;
    --link:      #f0a068;
    --fig-bg:     #201e1b;
    --fig-stroke: #d8d3c8;
    --fig-muted:  #6a655b;
    --fig-accent: #e08a4e;
    --fig-accent2:#5bb5ad;
    --fig-fill:   #2a211a;
    --fig-fill2:  #1c2726;
    --fig-text:   #ece8e0;
    --code-bg:    #1a1815;
    --tok-kw:  #e08a4e; --tok-str: #8fca7f; --tok-num: #d6a55a;
    --tok-com: #6f6a60; --tok-fn:  #5bb5ad;
  }

  /* ---------- Base typography ---------- */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { display: grid; grid-template-columns: 240px minmax(0,760px); gap: 48px;
          max-width: 1100px; margin: 0 auto; padding: 0 24px 120px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } #toc { position: static; } }

  header { grid-column: 1 / -1; padding: 44px 0 8px; }
  h1 { font-size: 2.1rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.5px; }
  .subtitle { color: var(--muted); font-size: 1.05rem; }

  h2 { font-size: 1.5rem; margin: 2.2em 0 0.5em; letter-spacing: -0.3px;
       padding-top: 12px; border-top: 1px solid var(--border); }
  h3 { font-size: 1.15rem; margin: 1.6em 0 0.4em; }
  p, li { max-width: 68ch; }
  a { color: var(--link); }

  /* short-lines / breathing rhythm helper */
  .beat { color: var(--text); margin: 0.2em 0; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

  /* key question / takeaway blockquote */
  blockquote { margin: 1.2em 0; padding: 12px 18px; border-left: 3px solid var(--accent);
               background: var(--accent-sf); border-radius: 0 8px 8px 0; }
  blockquote p { margin: 0; }

  /* ---------- Table of contents ---------- */
  #toc { position: sticky; top: 24px; align-self: start; font-size: 0.92rem;
         max-height: calc(100vh - 48px); overflow: auto; }
  #toc .label { text-transform: uppercase; letter-spacing: 1px; font-size: 0.72rem;
                color: var(--muted); margin-bottom: 10px; }
  #toc a { display: block; padding: 4px 0; color: var(--muted); text-decoration: none;
           border-left: 2px solid transparent; padding-left: 12px; }
  #toc a:hover, #toc a.active { color: var(--accent); border-left-color: var(--accent); }

  /* ---------- Figures ---------- */
  figure.fig { margin: 1.6em 0; padding: 20px; background: var(--surface);
               border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  figure.fig svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  figure.fig figcaption { margin-top: 12px; text-align: center; color: var(--muted);
                          font-size: 0.9rem; font-style: italic; }
  /* figures inherit these for currentColor / var() strokes */
  figure.fig svg text { fill: var(--fig-text); font-family: inherit; }

  /* ---------- Code ---------- */
  pre.code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
             padding: 16px 18px; overflow-x: auto; font-size: 0.92rem; line-height: 1.55;
             font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  code { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
         background: var(--code-bg); padding: 1px 5px; border-radius: 5px; font-size: 0.9em; }
  pre.code code { background: none; padding: 0; }
  .tok-kw { color: var(--tok-kw); font-weight: 600; }
  .tok-str{ color: var(--tok-str); }
  .tok-num{ color: var(--tok-num); }
  .tok-com{ color: var(--tok-com); font-style: italic; }
  .tok-fn { color: var(--tok-fn); }

  /* ---------- Tables ---------- */
  table { border-collapse: collapse; margin: 1.4em 0; width: 100%; font-size: 0.95rem; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  th { background: var(--accent-sf); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Boxed equation ---------- */
  .boxed-eq { display: inline-block; margin: 1.2em auto; padding: 12px 22px;
              border: 2px solid var(--accent); border-radius: 10px; background: var(--surface);
              font-size: 1.15rem; }
  .eq-center { text-align: center; }
  math { font-size: 1.05em; }

  /* "single most important line" call-out */
  .keyline { background: var(--accent-sf); border-left: 3px solid var(--accent);
             padding: 2px 8px; border-radius: 4px; }

  /* ---------- Theme toggle ---------- */
  #theme-toggle { position: fixed; top: 16px; right: 16px; z-index: 10;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 0.85rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  #theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* interactive figure helper: hover-highlight (opt-in via .interactive) */
  .fig.interactive .node { cursor: pointer; }
  .fig.interactive.dim .node:not(.hl) { opacity: 0.28; }
  .fig.interactive.dim .edge:not(.hl) { opacity: 0.15; }
</style>
</head>
<body>
<button id="theme-toggle" aria-label="Toggle light/dark theme">◐ Theme</button>

<div class="wrap">

  <header>
    <h1><!-- FILL: title, e.g. Quicksort, explained --></h1>
    <div class="subtitle"><!-- FILL: one-line what/why --></div>
  </header>

  <nav id="toc">
    <div class="label">Contents</div>
    <!-- FILL: one <a> per Part -->
    <a href="#part-1">1 · Why this file exists</a>
    <a href="#part-sample">SAMPLE Part</a>
  </nav>

  <main>

    <!-- ============================================================ -->
    <!-- SAMPLE Part — copy this <section> per Part, then delete this -->
    <!-- ============================================================ -->
    <section class="part" id="part-sample">
      <h2>Part N · <!-- name the Part as a question or plain label --></h2>

      <blockquote><p><strong>The one job:</strong> <!-- plain-English question this code answers --></p></blockquote>

      <p class="beat">Big picture — what problem, why it matters, what breaks without it.</p>

      <!-- a structural idea → an SVG from svg-cookbook.md -->
      <figure class="fig">
        <svg viewBox="0 0 400 120" role="img" aria-label="describe the figure">
          <!-- use var(--fig-*) and currentColor ONLY -->
          <rect x="20" y="30" width="120" height="50" rx="8"
                fill="var(--fig-fill)" stroke="var(--fig-stroke)" stroke-width="2"/>
          <text x="80" y="60" text-anchor="middle">example</text>
        </svg>
        <figcaption>One-line takeaway for this figure.</figcaption>
      </figure>

      <h3>A concrete toy example</h3>
      <p class="beat">Trace it by hand with real numbers.</p>

      <pre class="code"><code><span class="tok-com"># commented example</span>
<span class="tok-kw">def</span> <span class="tok-fn">demo</span>(x):
    <span class="tok-kw">return</span> x + <span class="tok-num">1</span></code></pre>

      <div class="eq-center"><div class="boxed-eq">the punchline equation</div></div>
    </section>

    <!-- FILL: real Parts here, simplest-first, orchestrator last -->

    <hr>
    <p><strong>In one sentence:</strong> <!-- FILL: bolded one-sentence summary --></p>

  </main>
</div>

<script>
  // ---------- Theme toggle (no persistence dependency; defaults to OS) ----------
  (function () {
    var root = document.documentElement;
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
    });
  })();

  // ---------- TOC scroll-spy ----------
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('#toc a'));
    var map = {};
    links.forEach(function (a) { var id = a.getAttribute('href').slice(1); map[id] = a; });
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && map[e.target.id]) {
          links.forEach(function (l) { l.classList.remove('active'); });
          map[e.target.id].classList.add('active');
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('section.part').forEach(function (s) { obs.observe(s); });
  })();

  // ---------- Opt-in: hover-highlight for figures marked .interactive ----------
  // Give nodes class="node" data-group="g1" and edges class="edge" data-group="g1".
  document.querySelectorAll('figure.fig.interactive').forEach(function (fig) {
    fig.querySelectorAll('.node').forEach(function (node) {
      node.addEventListener('mouseenter', function () {
        var g = node.getAttribute('data-group');
        fig.classList.add('dim');
        fig.querySelectorAll('[data-group="' + g + '"]').forEach(function (el) { el.classList.add('hl'); });
      });
      node.addEventListener('mouseleave', function () {
        fig.classList.remove('dim');
        fig.querySelectorAll('.hl').forEach(function (el) { el.classList.remove('hl'); });
      });
    });
  });
</script>
</body>
</html>
